name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Validate release tag
        env:
          VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must use semantic version format, for example v1.2.3 or v1.2.3-rc.1" >&2
            exit 1
          fi

      - name: Verify source
        run: |
          go test ./cmd ./internal/...
          go vet ./...

      - name: Build release archives
        env:
          VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          version_number="${VERSION#v}"
          mkdir -p build dist
          targets=(
            "linux amd64"
            "linux arm64"
            "windows amd64"
            "windows arm64"
            "darwin amd64"
            "darwin arm64"
          )

          for target in "${targets[@]}"; do
            read -r goos goarch <<< "${target}"
            asset_base="gotexttoepub_${VERSION}_${goos}_${goarch}"
            package_dir="build/${asset_base}"
            extension=""
            if [[ "${goos}" == "windows" ]]; then
              extension=".exe"
            fi

            mkdir -p "${package_dir}"
            CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" \
              go build \
                -trimpath \
                -ldflags="-s -w -buildid= -X main.appVersion=${version_number}" \
                -o "${package_dir}/gotexttoepub${extension}" \
                .

            if [[ "${goos}" == "windows" ]]; then
              (
                cd "${package_dir}"
                zip -q -9 "../../dist/${asset_base}.zip" "gotexttoepub.exe"
              )
            else
              tar -C "${package_dir}" -czf "dist/${asset_base}.tar.gz" "gotexttoepub"
            fi
          done

          (
            cd dist
            sha256sum gotexttoepub_* > "checksums_${VERSION}.txt"
          )

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          release_args=(
            release create "${VERSION}"
            dist/*
            --repo "${GITHUB_REPOSITORY}"
            --title "${VERSION}"
            --generate-notes
            --verify-tag
          )
          if [[ "${VERSION}" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh "${release_args[@]}"
